name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal

      - uses: docker/setup-buildx-action@v3

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Write Kamal secrets
        env:
          CDKG_DOMAIN: ${{ secrets.CDKG_DOMAIN }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          {
            echo "CDKG_DOMAIN=$CDKG_DOMAIN"
            echo "SERVER_IP=$SERVER_IP"
            echo "SSH_USER=$SSH_USER"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_KEY=~/.ssh/id_ed25519_deploy"
            echo "KAMAL_REGISTRY_USERNAME=$KAMAL_REGISTRY_USERNAME"
            echo "KAMAL_REGISTRY_PASSWORD=$KAMAL_REGISTRY_PASSWORD"
            echo "GOOGLE_API_KEY=$GOOGLE_API_KEY"
          } > .kamal/secrets

      - name: Deploy
        run: kamal deploy
