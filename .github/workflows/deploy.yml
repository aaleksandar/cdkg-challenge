name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Kamal
        run: gem install kamal

      - uses: docker/setup-buildx-action@v3

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Write Kamal secrets
        env:
          CDKG_DOMAIN: ${{ secrets.CDKG_DOMAIN }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Kamal parses this file with dotenv, where an UNQUOTED value ends at
          # the first "#" — the rest is a comment. A password of a8#!vC@YJ~fQ
          # therefore reached the container as "a8", and the panel rejected the
          # real password with no error anywhere to explain it. Inside single
          # quotes dotenv takes the value literally: no comment, and no $VAR
          # interpolation either, which an unquoted or double-quoted value does
          # perform. So every value is written quoted, not just the password.
          emit() {
            case $2 in
              # The one character single quoting cannot carry. Fail loudly rather
              # than write a value that would be silently wrong, which is the
              # whole bug being fixed here.
              *"'"*)
                echo "::error::$1 contains an apostrophe; not representable in .kamal/secrets" >&2
                exit 1 ;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            emit CDKG_DOMAIN "$CDKG_DOMAIN"
            emit SERVER_IP "$SERVER_IP"
            emit SSH_USER "$SSH_USER"
            emit SSH_PORT "$SSH_PORT"
            emit SSH_KEY "~/.ssh/id_ed25519_deploy"
            emit KAMAL_REGISTRY_USERNAME "$KAMAL_REGISTRY_USERNAME"
            emit KAMAL_REGISTRY_PASSWORD "$KAMAL_REGISTRY_PASSWORD"
            emit GOOGLE_API_KEY "$GOOGLE_API_KEY"
            # The ingestion panel's HTTP Basic credentials. Deliberately not
            # defaulted: an empty password disables auth in the app, and this
            # panel is reachable from the public internet.
            emit ADMIN_USER "$ADMIN_USER"
            emit ADMIN_PASSWORD "$ADMIN_PASSWORD"
          } > .kamal/secrets

      - name: Deploy
        env:
          CDKG_DOMAIN: ${{ secrets.CDKG_DOMAIN }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ~/.ssh/id_ed25519_deploy
          KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: kamal deploy
