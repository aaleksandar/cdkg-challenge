service: cdkg
image: <%= ENV.fetch('KAMAL_REGISTRY_USERNAME') %>/cdkg

servers:
  web:
    hosts:
      - <%= ENV.fetch('SERVER_IP') %>
  # The admin panel: separate role, separate container, separate blast radius.
  # A fault here cannot take down the public RAG app.
  #
  # Mounted under a path on the main domain rather than its own subdomain, so it
  # needs no second DNS record and no second certificate. kamal-proxy routes the
  # most specific path first, so /ingestion/* reaches this role and everything
  # else still reaches `web`.
  #
  # The prefix is deliberately NOT stripped, and ROOT_PATH tells the app the same
  # thing. Starlette strips a matching root_path itself before routing, and it is
  # the only one of the two that also does so for mounts: with the proxy stripping
  # instead, /ingestion/static/app.css arrived as /static/app.css and 404'd, and
  # the panel rendered with no stylesheet at all.
  ingest:
    hosts:
      - <%= ENV.fetch('SERVER_IP') %>
    proxy:
      host: <%= ENV.fetch('CDKG_DOMAIN') %>
      path_prefix: /ingestion
      strip_path_prefix: false
      app_port: 8503
      # Not `ssl: true`: only one role may hold the certificate for a host, and
      # that is `web`, which owns the domain. kamal-proxy terminates TLS once and
      # then routes by path, so this role is reached over the same HTTPS
      # connection without a certificate of its own.
      ssl: false
      healthcheck:
        path: /health
    env:
      clear:
        MODE: ingest
        SERVICE_PORT: "8503"
        ROOT_PATH: /ingestion
        REPO_ROOT: /repo
        GITHUB_REPO: Connected-Data/cdkg-challenge
        # Paths point into the git working copy, not the baked-in image.
        TRANSCRIPTS_DIR: /repo/Transcripts
        KUZU_DIR: /repo/src/kuzu
        DATA_DIR: /repo/src/kuzu/data
        ENTITIES_JSON: /repo/src/kuzu/entities.json
        DB_PATH: /data/cdl_db.kuzu
        STATE_DB_PATH: /data/ingest_state.db
        # The system runs itself: a newly published talk is detected, ingested
        # and written into the graph without being asked. All three are pause
        # valves in the panel's Advanced section, in the order the work happens —
        # read the channel, ingest what is found, write it to the graph — and a
        # restart returns to the value set here.
        #
        # The scheduler is started either way and started paused when this is
        # false, so the panel's switch can turn it back on without a redeploy.
        SCHEDULER_ENABLED: "true"
        AUTO_INGEST_NEW: "true"
        KG_ENABLED: "true"
        # Stays off until the GitHub App is installed. It writes outside this
        # machine, so it is not a click — flip it here, deliberately.
        GIT_PUSH_ENABLED: "false"
      secret:
        - GOOGLE_API_KEY
        # The panel spends money and rewrites the graph, so it is never served
        # open: `require_admin` falls through to "anonymous" when ADMIN_PASSWORD
        # is empty. Listing it here is what makes that impossible — Kamal refuses
        # to deploy at all when the secret is missing, which is the behaviour we
        # want, not something to work around by passing a blank value.
        - ADMIN_USER
        - ADMIN_PASSWORD
        # GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY belong here too, but only once
        # GIT_PUSH_ENABLED goes true. gitops reads them as optional and refuses to
        # publish without them, so requiring them now would block a deploy for a
        # feature that is switched off.
    # A role takes no `volumes:` key — Kamal validates it away, which is why this
    # role had never survived `kamal config`. Volumes are either global or passed
    # as docker run options. /data is global below and already reaches this role;
    # only the git working copy is specific to it, and the web app has no business
    # mounting that.
    options:
      volume: "cdkg_repo:/repo"

proxy:
  host: <%= ENV.fetch('CDKG_DOMAIN') %>
  app_port: 8501
  ssl: true

registry:
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    MODE: app
    DB_PATH: /data/cdl_db.kuzu
    BAML_GENERATE_ON_START: "1"
  secret:
    - GOOGLE_API_KEY

volumes:
  - "cdkg_data:/data"

builder:
  arch: amd64
  dockerfile: src/kuzu/Dockerfile
  context: .

ssh:
  user: <%= ENV.fetch('SSH_USER', 'root') %>
  port: <%= ENV.fetch('SSH_PORT', '22') %>
  keys:
    - <%= ENV.fetch('SSH_KEY', '~/.ssh/id_ed25519') %>

accessories:
  explorer:
    image: kuzudb/explorer:0.11.1
    host: <%= ENV.fetch('SERVER_IP') %>
    port: 8000:8000
    env:
      clear:
        MODE: READ_ONLY
        KUZU_FILE: cdl_db.kuzu
    volumes:
      - "cdkg_data:/database"
