[project]
name = "kuzu-cdkg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kuzu==0.11.3",
    "polars>=1.43.1",
    # streamlit caps this at <25; do not raise past that until streamlit does
    "pyarrow>=24.0.0,<25",
    # Pinned: baml_src/generators.baml hard-codes this version, and codegen
    # must match the installed runtime. Bump both together.
    "baml-py==0.223.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "streamlit>=1.60.0",
    # Used directly by evaluate.py's LLM judge
    "google-genai>=2.14.0",
    # --- Ingestion service (src/ingest) ---
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "yt-dlp>=2026.6.1",
    "apscheduler>=3.11.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
