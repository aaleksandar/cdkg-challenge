[project]
name = "kuzu-cdkg"
version = "0.1.0"
description = "The Connected Data Knowledge Graph: talks, speakers and tags from Connected Data conferences, with Graph RAG and an ingestion service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Exact pin, and deliberately not the newest: 0.20 writes storage format
    # 47 and every published Ladybug Explorer image reads at most 43, so the
    # Explorer accessory cannot open a database 0.20 wrote. Raise this and
    # the explorer tag in config/deploy.yml and src/kuzu/docker-compose.yml
    # together, once an image that reads the newer format is published.
    "ladybug==0.19.1",
    "polars>=1.43.1",
    # streamlit 1.65 allows <26 but excludes 25.0.0; raise the cap with streamlit's
    "pyarrow>=25.0.1,<26",
    # Pinned: baml_src/generators.baml hard-codes this version, and codegen
    # must match the installed runtime. Bump both together.
    "baml-py==0.226.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    # Used directly by evaluate.py's LLM judge
    "google-genai>=2.28.0",
    # --- Ingestion service (src/ingest) ---
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "yt-dlp[default,deno,curl-cffi]>=2026.8.19",
    "apscheduler>=3.11.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: runs the real stages and the real src/kuzu scripts in a subprocess (~30 s); deselect with -m 'not integration'",
]

[tool.ruff]
line-length = 100
extend-exclude = ["src/kuzu/baml_client"]

[tool.ruff.lint]
# Pinned rather than ruff's default, which grows between releases: a CI lint
# step must not start failing because the linter was upgraded.
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI's Depends()/Form()/File() defaults are the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The scripts load .env and their folder's config before importing what reads it.
"src/kuzu/*.py" = ["E402"]
# Git sequences in the tests read best as one line: add; commit; push.
"tests/**/*.py" = ["E702"]
