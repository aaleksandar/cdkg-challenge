{% if not states %}
  <div class="empty">
    <div class="big">Nothing here.</div>
    <p>No talks match this filter.</p>
  </div>
{% else %}
<table>
  <thead>
    <tr>
      <th></th>
      <th>Talk</th>
      <th>Status</th>
      <th>Tags</th>
      <th>Length</th>
      <th>Video</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
  {% for s in states %}
    {% include "partials/row.html" %}
  {% endfor %}
  </tbody>
</table>
{% endif %}
