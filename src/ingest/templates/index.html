<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDKG Ingestion</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version() }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>

<header class="masthead">
  <div class="wordmark">Connected Data <span>· Knowledge Graph ingestion</span></div>
  <div class="spacer"></div>
  <div class="meta">{{ total }} talks reconciled</div>
</header>

{% include "partials/figures.html" %}

<form id="picks" hx-post="/ingest" hx-target="#flash" hx-swap="innerHTML"
      hx-disabled-elt="#ingest-btn">

  <div class="controls">
    <input class="search" type="search" name="q" placeholder="Search title, speaker, event…"
           value="{{ query }}"
           hx-get="/rows" hx-target="#sheet"
           hx-trigger="input changed delay:250ms, search"
           hx-vals='js:{status: new URLSearchParams(location.search).get("status") || "all"}'>
    <div class="spacer"></div>
    {% include "partials/gate.html" %}
    <button type="button" class="btn" hx-post="/refresh" hx-target="#flash">Refresh channel</button>
    <button type="button" class="btn" hx-post="/rebuild" hx-target="#flash"
            hx-indicator="#busy">Rebuild graph</button>
    <span id="busy" class="htmx-indicator muted">working…</span>
    <span id="flash"></span>
  </div>

  {# Polls only while something is actually running, then stops. #}
  <div id="live" hx-get="/live" hx-trigger="load, every 2s" hx-swap="innerHTML"></div>

  <div class="sheet" id="sheet">
    {% include "partials/rows.html" %}
  </div>

  <div class="actionbar" id="actionbar" hidden>
    <span><strong id="picked">0</strong> selected</span>
    <button class="btn" type="submit" id="ingest-btn">Ingest selected</button>
  </div>
</form>

<div id="drawer"></div>

<script>
  const form = document.getElementById('picks');
  const bar = document.getElementById('actionbar');
  const picked = document.getElementById('picked');

  function sync() {
    const n = form.querySelectorAll('input[name=video_ids]:checked').length;
    picked.textContent = n;
    bar.hidden = n === 0;
  }
  form.addEventListener('change', e => { if (e.target.name === 'video_ids') sync(); });

  document.body.addEventListener('htmx:afterSwap', sync);

  document.body.addEventListener('click', e => {
    if (e.target.closest('.scrim, .close')) document.getElementById('drawer').innerHTML = '';
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('drawer').innerHTML = '';
  });
</script>

</body>
</html>
