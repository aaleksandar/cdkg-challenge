services:
  explorer:
    # Pinned to the newest published image, which reads storage format 43 and so
    # matches the `ladybug` pin in pyproject.toml. Raise both together.
    image: ghcr.io/ladybugdb/explorer:0.19.1
    ports:
      - "8000:8000"
    environment:
      MODE: READ_ONLY
      LBUG_FILE: cdl_db.kuzu
    volumes:
      - ./cdl_db.kuzu:/database/cdl_db.kuzu
